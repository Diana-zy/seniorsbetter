<!DOCTYPE html>
<html>
  <head {{ HEAD_ATTRS }}>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    {{ HEAD }}
    <script src="/trackEvent.js"></script>
    <script src="/linkMarking.js"></script>
    <script src="/dataMonitor.js"></script>
    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const ttclid = searchParams.get("ttclid");
      if (ttclid) { window.setCookie("hi_ttclid", ttclid); }
      const tblci = searchParams.get("tblci");
      const dicbo = searchParams.get("dicbo");
      tblci && window.setCookie("hi_tblci", tblci);
      dicbo && window.setCookie("hi_dicbo", dicbo);
      const script = document.createElement("script");
      script.src = "https://wc.bunchthings.com/youknowwho.js?" + Date.now();
      document.head.appendChild(script);
      script.onload = function () {
        pushEventToGTM("Page_View_Ip", {
          hi_ip: window.youknowwho_ip || "unknown",
          hi_country: window.youknowwho_ip_country || "unknown"
        });
      };
    </script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STTCN4ZF96"></script>
    <script>
      function getUserProperty() {
        const hi_user_source = getValueByURLOrCookie("hi_source");
        const hi_user_sub_site = getHostname();
        const hi_user_timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";
        const { hi_source_clid: hi_user_source_clid, hi_source_aid: hi_user_source_aid, hi_source_site: hi_user_source_site, hi_source_site_name: hi_user_source_site_name, hi_section_id: hi_user_section, hi_section_name: hi_user_section_name } = getInfoBySource(hi_user_source);
        return { hi_user_source, hi_user_sub_site, hi_user_timezone, hi_user_source_clid, hi_user_source_aid, hi_user_source_site, hi_user_source_site_name, hi_user_section, hi_user_section_name };
      }
      window.dataLayer = window.dataLayer || [];
      function legacyUUID() {
        return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
          const r = (Math.random() * 16) | 0;
          const v = c === "x" ? r : (r & 0x3) | 0x8;
          return v.toString(16);
        });
      }
      let uuid = window.getCookie("hi_user_id");
      if (!uuid) { uuid = legacyUUID().replace(/-/g, ""); window.setCookie("hi_user_id", uuid); }
      const userProperties = { ...getUserProperty(), hi_user_id: uuid, hi_channel_user: getValueByURLOrCookie("channel") };
      gtag("set", "user_properties", { ...userProperties });
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-STTCN4ZF96");
      (function () {
        const { fetch: originalFetch } = window;
        window.fetch = async (...args) => {
          let [resource, config] = args;
          if (resource.includes("https://www.google-analytics.com/g/collect")) {
            for (let key in userProperties) {
              if (!resource.includes(`up.${key}=${userProperties[key]}`)) {
                resource = resource + `&up.${key}=${userProperties[key]}`;
              }
            }
          }
          return await originalFetch(resource, config);
        };
      })();
      // seo organic traffic timing and page view events
      (function (uuid) {
        let new_time = new Date().getTime();
        const hi_user_source = getValueByURLOrCookie("hi_source");
        if (hi_user_source === "unknown") {
          if (window.location.pathname === "/") {
            window.dataLayer.push({ event: "Home_Page_View_SEO" });
          }
          if (window.location.pathname.startsWith("/category/")) {
            let path = window.location.pathname.split("/")[2];
            const lastDashIndex = path.lastIndexOf("-");
            const id = path.substring(lastDashIndex + 1, path.length);
            window.dataLayer.push({ event: "Category_Page_View_SEO", SEO_category: "category_" + id });
          }
          if (window.location.pathname.startsWith("/detail/")) {
            let path = window.location.pathname.split("/")[2];
            const lastDashIndex = path.lastIndexOf("-");
            const id = path.substring(lastDashIndex + 1, path.length);
            window.dataLayer.push({ event: "Detail_Page_View_SEO", SEO_detail: "detail_" + id });
          }
          try {
            let seo_user_id = JSON.parse(window.getCookie("seo_user_id-" + uuid)) || {};
            if (!seo_user_id.first_time) { seo_user_id.first_time = new_time; }
            if (!seo_user_id.Page_View_SEO) {
              window.dataLayer.push({ event: "Page_View_SEO" });
              seo_user_id.Page_View_SEO = "yes";
            }
            window.setCookie("seo_user_id-" + uuid, JSON.stringify(seo_user_id));
            if (!seo_user_id.User_Stay_10s_SEO || !seo_user_id.User_Stay_20s_SEO) {
              new_time = new Date().getTime();
              const timer = setInterval(() => {
                new_time += 1;
                if (new_time - Number(seo_user_id.first_time) >= 10000 && !seo_user_id.User_Stay_10s_SEO) {
                  window.dataLayer.push({ event: "User_Stay_10s_SEO" });
                  seo_user_id.User_Stay_10s_SEO = "yes";
                  window.setCookie("seo_user_id-" + uuid, JSON.stringify(seo_user_id));
                }
                if (new_time - Number(seo_user_id.first_time) >= 20000 && !seo_user_id.User_Stay_20s_SEO) {
                  window.dataLayer.push({ event: "User_Stay_20s_SEO" });
                  seo_user_id.User_Stay_20s_SEO = "yes";
                  window.setCookie("seo_user_id-" + uuid, JSON.stringify(seo_user_id));
                  clearInterval(timer);
                }
                if (new_time - Number(seo_user_id.first_time) >= 30000) { clearInterval(timer); }
              }, 1);
            }
          } catch (e) {}
        }
      })(uuid);
    </script>
    <script>
      (function () {
        const { pathname } = window.location;
        const hi_source = getValueByURLOrCookie("hi_source");
        const { hi_source_clid } = getInfoBySource(hi_source);
        if (pathname.includes("/detail")) {
          window.setCookieTomorrow("detail_time", new Date().getTime());
          const detailPvUser = window.getCookie("detailPvUser");
          if (detailPvUser) {
            let buffer = {};
            try {
              buffer = JSON.parse(detailPvUser);
              if (!buffer[hi_source_clid]) {
                buffer[hi_source_clid] = { isPush: true, time: new Date().getTime() };
                if (!buffer[getHostname() + "_isPushGtm"]) {
                  if (buffer[getHostname() + "_first"]) {
                    if (!buffer[getHostname() + "_second"] && buffer[getHostname() + "_first"] !== hi_source_clid) {
                      buffer[getHostname() + "_second"] = hi_source_clid;
                    }
                  } else {
                    buffer[getHostname() + "_first"] = hi_source_clid;
                  }
                }
                pushEventToGTM("Detail_pv_user");
                setCookieTomorrow("detailPvUser", JSON.stringify(buffer));
              }
            } catch (e) {}
          } else {
            let buffer = {};
            buffer[hi_source_clid] = { isPush: true, time: new Date().getTime() };
            buffer[getHostname() + "_first"] = hi_source_clid;
            pushEventToGTM("Detail_pv_user");
            setCookieTomorrow("detailPvUser", JSON.stringify(buffer));
          }
        }
      })();
    </script>
    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-TXN45PNR");
    </script>
    <!-- End Google Tag Manager -->

    <script async="async" src="https://www.google.com/adsense/search/ads.js"></script>
    <script type="text/javascript" charset="utf-8">
      (function (g, o) {
        (g[o] = g[o] || function () { (g[o]["q"] = g[o]["q"] || []).push(arguments); }), (g[o]["t"] = 1 * new Date());
      })(window, "_googCsa");
    </script>

    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in window.navigator) {
          window.navigator.serviceWorker.register("/sw.js").then(() => {}).catch(() => {});
        }
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          window.deferredPrompt = e;
        });
      });
    </script>
  </head>
  <body {{ BODY_ATTRS }} tabindex="0">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TXN45PNR" height="0" width="0" style="display: none; visibility: hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    {{ APP }}
    <script>
      window.isUnloaded = false;
      window.done = false;
      window.done1 = false;
      window.addEventListener("beforeunload", () => {
        if (!window.done) {
          const activeElement = document.activeElement;
          const src = activeElement?.getAttribute("src") || "";
          let eventName = "";
          if (src.includes("afs/ads?")) {
            if (activeElement.getAttribute("title")) {
              window.trackEventToPixel("T_AR");
              const searchParams = new URLSearchParams(window.location.search);
              const ttclid = searchParams.get("ttclid");
              pushEventToGTM("T_AR", { hi_country: window.youknowwho_ip_country || "unknown", hi_ip: window.youknowwho_ip || "unknown", hi_ttclid: ttclid || window.getCookie("hi_ttclid") || "unknown" });
              handleDataMonitor();
              const hi_user_source_tar = getValueByURLOrCookie("hi_source");
              if (hi_user_source_tar === "unknown") {
                if (window.location.pathname.startsWith("/detail/")) {
                  let detailPath = window.location.pathname.split("/")[2];
                  const lastDashIdx = detailPath.lastIndexOf("-");
                  const detailId = detailPath.substring(lastDashIdx + 1, detailPath.length);
                  window.dataLayer.push({ event: "Detail_T_AR_SEO", SEO_detail: "detail_" + detailId });
                }
              }
            } else {
              window.pushEventParamsToGtm("T_AC");
              TACChangeCookie();
              if (window.location.pathname.startsWith("/detail")) window.setCookie("click_ad", 1);
              const hi_user_source_tac = getValueByURLOrCookie("hi_source");
              if (hi_user_source_tac === "unknown") {
                if (window.location.pathname.startsWith("/detail/")) {
                  let detailPath = window.location.pathname.split("/")[2];
                  const lastDashIdx = detailPath.lastIndexOf("-");
                  const detailId = detailPath.substring(lastDashIdx + 1, detailPath.length);
                  window.dataLayer.push({ event: "Detail_D_T_AC_SEO", SEO_detail: "detail_" + detailId });
                  window.setCookie("SEO_detail", "detail_" + detailId);
                }
              }
            }
          } else if (src.includes("afs/ads/i/")) {
            eventName = "T_AG";
          }
          if (eventName) { dataLayer.push({ event: eventName }); window.done = true; }
        }
      });
      window.addEventListener("blur", () => {
        const activeElement = document.activeElement;
        const sourceAttribute = activeElement.getAttribute("src");
        if (sourceAttribute && sourceAttribute.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) dataLayer.push({ event: "D_AR" });
          else dataLayer.push({ event: "D_AC" });
        }
      });
      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => { window.done = false; window.done1 = false; document.body.focus(); }, 0);
        }
      });
      function HandleMessageTACANDTAR(e) {
        if (window.done1) return;
        const activeElement = document.activeElement;
        const src = activeElement?.getAttribute("src") || "";
        if (src.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) { dataLayer.push({ event: "T_AR_NEW" }); window.done1 = true; }
          else { window.trackEventToPixel("T_AC_MSG"); dataLayer.push({ event: "T_AC_MSG", hi_time: handleTACMSGToLoad() }); window.done1 = true; }
        }
      }
      window.addEventListener("message", (e) => {
        if (typeof e?.data === "string" && e?.data?.startsWith("FSXDC,.aCS:")) HandleMessageTACANDTAR();
      });
    </script>
  </body>
</html>
